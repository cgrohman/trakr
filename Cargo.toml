[workspace]
resolver = "2"
members = ["crates/trakr-core", "crates/trakr-skytrak", "crates/trakr-openconnect", "crates/trakr", "crates/trakr-daemon"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/corigrohman/trakr"

[workspace.dependencies]
trakr-core = { path = "crates/trakr-core" }
trakr-skytrak = { path = "crates/trakr-skytrak" }
trakr-openconnect = { path = "crates/trakr-openconnect" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
crc = "3"
aes = "0.8"
cbc = "0.1"
ctr = "0.9"
trakr-daemon = { path = "crates/trakr-daemon" }
axum = { version = "0.8", features = ["json"] }
tokio-stream = { version = "0.1", features = ["sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
