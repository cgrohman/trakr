name: Build desktop app

# Builds the actual installable trakr-ui bundles (.deb/.AppImage on Linux,
# .msi/.exe on Windows) and uploads them as workflow artifacts. Deliberately
# does NOT create a GitHub Release: omitting tagName/releaseName/releaseId is
# tauri-action's documented "build only" mode. Wire up a release trigger
# later if/when you actually want tagged builds published publicly.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: install system dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: install frontend dependencies
        working-directory: apps/trakr-ui
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/trakr-ui
          uploadWorkflowArtifacts: true
          args: ${{ matrix.args }}
