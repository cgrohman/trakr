[package]
name = "trakr-ui"
version = "0.1.0"
description = "trakr desktop UI: connect, arm, and watch your launch monitor"
authors = ["trakr"]
edition = "2021"
license = "MIT"

[lib]
name = "trakr_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
trakr-core = { workspace = true }
trakr-daemon = { workspace = true }
trakr-openconnect = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
